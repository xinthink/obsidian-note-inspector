name: Release

# Obsidian downloads main.js / manifest.json / styles.css from the release whose
# tag equals the `version` field in manifest.json, so the tag must be the bare
# version (1.2.3, not v1.2.3).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check the tag matches the manifest
        run: node scripts/check-manifest.mjs "$GITHUB_REF_NAME" --assets

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
