name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check plugin metadata
        run: node scripts/check-manifest.mjs --assets

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: note-inspector
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
