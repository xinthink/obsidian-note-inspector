name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (obsidianmd recommended rules, manifest.json included)
        run: npm run lint

      - name: Lint CSS (official stylelint-config-obsidianmd, as used by the review)
        run: npm run lint:css

      - name: Check plugin metadata (release requirements)
        run: node scripts/check-manifest.mjs --assets
